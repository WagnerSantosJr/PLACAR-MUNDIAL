<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="Placar Live - Resultados e classificações de futebol em tempo real">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Placar Live">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Placar Live</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar / Bottom Nav -->
    <aside class="side" id="side">
      <div class="logo">
        <span class="logo-icon">⚽</span>
        <span class="logo-text">Placar Live</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-btn on" data-page="live" aria-label="Ao Vivo">
          <span class="nav-icon">🔴</span>
          <span class="nav-label">Ao Vivo</span>
        </button>
        <button class="nav-btn" data-page="games" aria-label="Jogos">
          <span class="nav-icon">🏟️</span>
          <span class="nav-label">Jogos</span>
        </button>
        <button class="nav-btn" data-page="tables" aria-label="Tabelas">
          <span class="nav-icon">🏆</span>
          <span class="nav-label">Tabelas</span>
        </button>
        <button class="nav-btn" data-page="favorites" aria-label="Favoritos">
          <span class="nav-icon">⭐</span>
          <span class="nav-label">Favoritos</span>
        </button>
        <button class="nav-btn" data-page="settings" aria-label="Configurações">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Config.</span>
        </button>
      </nav>
      <div class="state" id="apiStateWrap">
        <span id="dot" class="dot"></span>
        <span id="apiState">Demonstração</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrap">
      <header class="top" id="top">
        <div class="search-wrap">
          <input type="search" id="search" class="search" placeholder="Pesquisar time ou campeonato..." autocomplete="off">
          <button class="btn icon-btn" id="reload" title="Atualizar" aria-label="Atualizar">↻</button>
        </div>
      </header>

      <!-- Live Ticker -->
      <div class="ticker-wrap" id="tickerWrap" hidden>
        <div class="ticker" id="ticker"></div>
      </div>

      <section class="main" id="content">
        <!-- Dynamic content injected here -->
      </section>
    </main>
  </div>

  <!-- Match Details Modal -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet">
      <button class="btn close" id="close" aria-label="Fechar">✕</button>
      <div id="details"></div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toasts"></div>

  <!-- Offline indicator -->
  <div class="offline-bar" id="offlineBar" hidden>Você está offline. Usando cache local.</div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
